<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <defs>
    <linearGradient id="lerna-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Mark -->
  <g transform="translate(10, 20)">
    <!-- Abstract L / Book / Brain shape -->
    <path d="M20 0 L40 20 L20 40 L0 20 Z" fill="url(#lerna-grad)" opacity="0.8" />
    <path d="M40 20 L60 0 L80 20 L40 60 Z" fill="#38bdf8" filter="url(#glow)" />
    <path d="M20 40 L40 60 L60 40 L40 20 Z" fill="#0284c7" />
  </g>

  <!-- Text Mark -->
  <text x="110" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="52" fill="#ffffff" letter-spacing="-1">Lerna</text>
</svg>
